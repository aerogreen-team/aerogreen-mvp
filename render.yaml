# Render Blueprint — VƯỜN PHỐ
# Tài liệu: https://render.com/docs/blueprint-spec
#
# Cách dùng: Render Dashboard → New → Blueprint → chọn repo này.
# Render sẽ tự tạo Web Service theo cấu hình dưới đây; bạn chỉ cần nhập 3 biến bí mật.

services:
  - type: web
    name: vuonpho
    runtime: node
    plan: free
    branch: api-engine
    # Dependencies và code backend nằm trong thư mục server/
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    # Render dùng endpoint này để biết service đã sẵn sàng
    healthCheckPath: /api/health
    autoDeployTrigger: commit # tự deploy mỗi khi push lên nhánh api-engine
    envVars:
      # Ba biến dưới đây là BÍ MẬT: sync: false nghĩa là Render sẽ hỏi giá trị
      # lúc tạo service và không lưu vào repo.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      # Ghim phiên bản Node để có sẵn process.loadEnvFile (cần Node >= 20.12)
      - key: NODE_VERSION
        value: 22.15.1
